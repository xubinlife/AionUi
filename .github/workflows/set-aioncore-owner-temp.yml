name: Set AionCore owner (temporary)

on:
  push:
    branches:
      - preset-configuration
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preset-configuration
          fetch-depth: 0

      - name: Update AionCore owner
        shell: bash
        run: |
          set -euo pipefail
          FILE='packages/shared-scripts/src/prepare-aioncore.js'
          grep -F "const GITHUB_OWNER = 'iOfficeAI';" "$FILE"
          sed -i "s/const GITHUB_OWNER = 'iOfficeAI';/const GITHUB_OWNER = 'xubinlife';/" "$FILE"
          git diff --check
          git diff -- "$FILE"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared-scripts/src/prepare-aioncore.js
          git commit -m 'build: use forked AionCore repository'
          git push origin HEAD:preset-configuration
