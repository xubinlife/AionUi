name: Fix and verify preset TypeScript (temporary)

on:
  push:
    branches:
      - preset-configuration
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preset-configuration
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix TS7011
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/desktop/src/process/utils/presetConfiguration.ts')
          s = p.read_text()
          old = ".catch(() => undefined);"
          new = ".catch((): undefined => undefined);"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Format changed file
        run: bunx oxfmt packages/desktop/src/process/utils/presetConfiguration.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Check formatting
        run: bun run format:check

      - name: Run preset unit tests
        run: bun run test -- tests/unit/bootstrap/presetConfiguration.test.ts tests/unit/bootstrap/runBackendMigrations.test.ts

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src/process/utils/presetConfiguration.ts
          git commit -m "fix: annotate preset cleanup callback return type"
          git push origin HEAD:preset-configuration
