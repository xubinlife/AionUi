name: Format preset branch (temporary)

on:
  push:
    branches:
      - preset-configuration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preset-configuration
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format files
        run: |
          bunx oxfmt \
            packages/desktop/src/process/utils/presetConfiguration.ts \
            packages/desktop/src/process/utils/runBackendMigrations.ts \
            public/preset/computing-platform.json \
            tests/unit/bootstrap/presetConfiguration.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/desktop/src/process/utils/presetConfiguration.ts \
            packages/desktop/src/process/utils/runBackendMigrations.ts \
            public/preset/computing-platform.json \
            tests/unit/bootstrap/presetConfiguration.test.ts
          git commit -m "style: format preset configuration"
          git push origin HEAD:preset-configuration
