name: Verify preset branch (temporary)

on:
  push:
    branches:
      - preset-configuration
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preset-configuration

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run preset unit tests
        run: bun run test -- tests/unit/bootstrap/presetConfiguration.test.ts tests/unit/bootstrap/runBackendMigrations.test.ts
