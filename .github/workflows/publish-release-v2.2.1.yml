name: Publish AionUi v2.2.1

on:
  push:
    branches:
      - release-v2.2.1
  workflow_dispatch:

concurrency:
  group: publish-aionui-v2.2.1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate merged release
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release-v2.2.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.version !== '2.2.1') {
            throw new Error(`Expected package version 2.2.1, got ${pkg.version}`);
          }
          if (pkg.aioncoreVersion !== 'v0.2.1') {
            throw new Error(`Expected AionCore v0.2.1, got ${pkg.aioncoreVersion}`);
          }
          console.log(`Validated AionUi ${pkg.version} with AionCore ${pkg.aioncoreVersion}`);
          NODE

      - name: Verify forked AionCore release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh api repos/xubinlife/AionCore/releases/tags/v0.2.1 --jq '[.draft, .prerelease] | @tsv')"
          if [[ "${release_state}" != $'false\tfalse' ]]; then
            echo "AionCore v0.2.1 must be a published stable release; got: ${release_state}" >&2
            exit 1
          fi

          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            aioncore-checksums.txt \
            aioncore-v0.2.1-aarch64-apple-darwin.tar.gz \
            aioncore-v0.2.1-aarch64-pc-windows-msvc.zip \
            aioncore-v0.2.1-aarch64-unknown-linux-gnu.tar.gz \
            aioncore-v0.2.1-x86_64-apple-darwin.tar.gz \
            aioncore-v0.2.1-x86_64-pc-windows-msvc.zip \
            aioncore-v0.2.1-x86_64-unknown-linux-gnu.tar.gz \
            | sort > "${expected}"
          gh api repos/xubinlife/AionCore/releases/tags/v0.2.1 \
            --jq '.assets[] | select(.state == "uploaded") | .name' \
            | sort > "${actual}"
          diff -u "${expected}" "${actual}"
          echo "Validated all required AionCore v0.2.1 assets."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  create-tag:
    name: Create v2.2.1 tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated release branch
        uses: actions/checkout@v6
        with:
          ref: release-v2.2.1
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Create and push release tag
        shell: bash
        env:
          TAG: v2.2.1
          RELEASE_BRANCH: release-v2.2.1
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          remote_branch_sha="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_branch_sha}" != "${head_sha}" ]]; then
            echo "Branch moved during validation: expected ${head_sha}, got ${remote_branch_sha}" >&2
            exit 1
          fi

          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing_sha="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing_sha}" != "${head_sha}" ]]; then
              echo "Tag ${TAG} already exists at ${existing_sha}, expected ${head_sha}" >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to ${head_sha}; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${head_sha}"
          git push origin "refs/tags/${TAG}"
